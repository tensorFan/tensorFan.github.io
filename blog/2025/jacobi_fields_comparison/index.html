    <!-- ## Jacobi fields vanishing at a point

Let $J: [0,\pi] \to TM$ such that $J(0) = 0$.
Then the geodesic variation $\Gamma(s,t) = \exp_{\sigma(s)}(tW(s))$
has a certain form which gives a nice formula for $J$.

$$T_v T_p M \simeq T_p M$$


![alt text](../assets/img/blog_posts/j2-1.png) 

### Lemma 2 (explicit form of Jacobi fields)

Let $\gamma: [0,\pi] \to M$ geodesic, $p = \gamma(0)$, $v = \gamma'(0)$.
Let $J: [0,\pi] \to TM$ Jacobi, $J(0) = 0$, $J'(0) = \frac{D}{dt}J|_{t=0} = w$

Then $J(t) = (d\exp_p)_{tv}(tw)$ ← only true if

![alt text](../assets/img/blog_posts/j2-2.png) 

#### Proof

$\gamma(t) = \exp_p(tv)$

Consider $\exp_p(t(v + sw))$

Since each $\gamma_s := \exp_p(\cdot|v+sw|)$ geodesic, it's a geodesic variation.

$$\Rightarrow \overline{J} = \partial_s \exp_p(t(v+sw))|_{s=0}$$

$$= (d\exp_p)_{t(v+sw)} \partial_s t(v+sw)|_{s=0}$$

$$= (d\exp_p)_{tv}(sw), \quad \text{is Jacobi !}$$ 
<div style="text-align: right"> $\square$ </div>

---

### Gauss Lemma

Let $p \in M$, $v \in T_p M$ such that $\exp_p tv =: \gamma(t)$ defined for $t \in [0,1]$

$$\Rightarrow \langle (d\exp_p)_v(v), (d\exp_p)_v(w) \rangle = \langle v,w \rangle, \quad w \in T_v T_p M \simeq T_p M$$

$$= \langle T_v \exp_p v, T_v \exp_p w \rangle$$

#### Proof

We know that $J(t) = (d\exp_p)_{tv}(tw): [0,1] \to TM$

is the Jacobi field along $\exp_p tv$ such that $J(0) = 0$, $J'(0) = w$.

Let $w = \lambda v + w_\perp$ such that $\langle w_\perp, v \rangle = 0$

$$\Rightarrow J(t) = (d\exp_p)_{tv}(t\lambda v + tw_\perp)$$

$$= \lambda (d\exp_p)_{tv}(tv) + (d\exp_p)_{tv}(tw_\perp)$$

$$= \lambda t \gamma'(t) + J_\perp(t), \quad \langle J_\perp(t), \gamma'(t) \rangle = 0$$

So $\langle (d\exp_p)_v(v), (d\exp_p)_v(w) \rangle = \langle \gamma'(1), J(1) \rangle$

$$= \lambda |\gamma'(1)|^2 + 0 = \lambda \quad \text{since } \gamma(t) \text{ param. arc-l.}$$

And $\langle v,v \rangle = \lambda |v|^2 = \lambda$. 
<div style="text-align: right"> $\square$ </div>

Take $B = \exp_p(B_r)$ and $w \in T_p M \simeq T_v B_r$ such that $\langle w,v \rangle = 0$

for $v \in T_p M$ such that $|v| = 1$.

So $v \in S_r$ and $\gamma(t) = \exp_p(tv)$ is radial

since $\langle \gamma'(1), J_w(1) \rangle = 0$ by Gauss Lemma.

---

As an application to Lemma 2 we can view
$J$ such that $J(0) = 0$ in normal coordinates $\{x^i\}_{i=1}^n$.

Recall $d\exp_p$ invertible (the identity) at $0$
$\Rightarrow$ inverse function theorem
$\exp_p: U \to \tilde{U}$ diffeom. for $U$ sufficiently small.

On identification of $\mathbb{R}^n \simeq U$ we get essentially the
normal chart as $\exp_p^{-1}: \tilde{U} \to \mathbb{R}^n$.

Any geodesic $\gamma(t) = \exp_p(tv)$

so $\gamma(t) \sim tv = (tv^1, \ldots, tv^n)$ in $U \simeq \mathbb{R}^n$.

So the variation from Lemma 2 is

$$\exp_p(t(v + sw)) \sim t(v + sw^1, \ldots, v^n + sw^n)$$

$$\xrightarrow{\text{glue}} t(w^1, \ldots, w^n)$$

$$\Rightarrow J(t) = tw^i \partial_i|_{\gamma(t)} \quad \text{on } \tilde{U} \subset M.$$

### Corollary

Every $w \in T_q M$ geodesic is the value of a Jacobi field $J$
along a radial geodesic $\gamma$ such that $J(0) = 0$, $\gamma(0) = p$.

**Proof:** Let $\gamma(t) = (tq^1, \ldots, tq^n)$ such that $\gamma(0) = p$, $\gamma(1) = q$.

$J(t) = (tw^1, \ldots, tw^n) = \partial_s t(q^1 + sw^1, \ldots, q^n + sw^n)|_{s=0}$

with $J(0) = 0$, $J(1) = w$. <div style="text-align: right"> $\square$ </div>

---

### Proposition 2 (Curvature and spread of geodesics)

Let $\gamma, J$ as Lemma 2. Set $|w| = 1$.

$$\Rightarrow |J(t)|^2 = s^2 - \frac{1}{3}sR(v,w)v,w \rangle s^4 + R(s), \quad s \ll a$$

where $\frac{R(s)}{s^4} \to 0$. (So $R(s) \sim O(s^5)$)

#### Proof

$|J|^2 = \langle J, J \rangle \in \mathbb{R}$ so Taylor expansion around $0$:

*assumed in one chart ?*

$$\langle J(s), J(s) \rangle = \langle J(0), J(0) \rangle + s \frac{d}{ds} \langle J,J \rangle|_{s=0} + s^2 \frac{d^2}{ds^2} \langle J,J \rangle|_{s=0}$$

$$+ s^3 \frac{d^3}{ds^3} \langle J,J \rangle|_{s=0} + s^4 \frac{d^4}{ds^4} \langle J,J \rangle|_{s=0} + O(s^5)$$

$$\langle J(0), J(0) \rangle = 0$$

$$\frac{d}{ds} \langle J,J \rangle = \langle J', J \rangle + \langle J, J' \rangle = 2 \langle J', J \rangle|_{s=0} = 0$$

$$|w| = 1$$

$$\frac{d^2}{ds^2} \langle J,J \rangle = 2 \frac{d}{ds} \langle J, J' \rangle = 2 \langle J', J' \rangle + 2 \langle J, J'' \rangle|_{s=0} = 2$$

$$\frac{d^3}{ds^3} \langle J,J \rangle = 4 \langle J'', J' \rangle + 2 \langle J', J'' \rangle + 2 \langle J, J''' \rangle$$

$$= 6 \langle J'', J' \rangle + 2 \langle J, J''' \rangle|_{s=0}$$

$$= -R(J,\gamma')\gamma'$$

$$= -6 \langle R(0,v)v, w \rangle = 0 \quad J(0) = 0$$

$$\frac{d^4}{ds^4} \langle J,J \rangle = 6 \langle J''', J' \rangle + 6 \langle J'', J'' \rangle + 2 \langle J', J''' \rangle + 2 \langle J,J^{iv} \rangle$$

$$= -8 \langle \frac{D}{ds} R(J,\gamma')\gamma', J' \rangle_{s=0} = -8 \langle R(w,v)v, w \rangle$$

$$\frac{D}{ds} R(J,\gamma')\gamma' = (\nabla_R)(J,\gamma')\gamma' + R(J',\gamma')\gamma' + R(J,\gamma'')\gamma' + R(J,\gamma')\gamma''$$ 

<div style="text-align: right"> $\square$ </div>

---

## Application: curvature of $S^n$, $H^n$

### $S^n$
$\gamma(t) = \cos t x + \sin t v$ geodesic $|x| = |v| = 1$.

$J(0) = 0$, $J'(0) =: w \perp v$ such that $|w| = 1$, $w \perp x$.

By uniqueness $J(t) = \sin t w$

$|J(t)|^2 = \sin^2 t = t^2 - \frac{t^4}{3} + O(t^5)$

**Prop 2**
$= t^2 - \frac{t^4}{3}\langle R(v,w)v, w \rangle + O(t^5)$

$$\Rightarrow \langle R(v,w)v, w \rangle = 1 \quad \text{and } K = \langle R(v,w)v, w \rangle$$

$$\frac{\langle v,v \rangle \langle w,w \rangle - \langle v,w \rangle^2}{?}$$

So sectional curvature always $= 1$ since $v,w$ arbitrary.

### $H^n$
$\gamma(t) = \cosh t x + \sinh t v$ geodesic $|x| = |v| = 1$

$J(t) = \sinh t w$, $w \perp v$

$\sinh t = t^2 + \frac{t^4}{3} + O(t^5)$

$$\Rightarrow K = -1$$ -->
